<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题复习调度工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f6f8f'/%3E%3Cpath d='M7 13l3 3 7-7' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg1:#edf1f6; --bg2:#f7f9fc;
  --card:rgba(255,255,255,.66);
  --card-border:rgba(255,255,255,.85);
  --line:rgba(31,41,55,.10);
  --text:#1f2937; --muted:#6b7280;
  --accent:#2f6f8f; --accent-soft:rgba(47,111,143,.12);
  --teal:#3e9b96;
  --r1:#4c7db0; --r2:#d08a3e; --r3:#c25e5e; --r4:#3e9b96;
  --shadow:0 8px 30px rgba(47,111,143,.10);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 60%,#eef7f5 100%);
  min-height:100vh; line-height:1.55;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}

/* ===== 顶部 ===== */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand h1{font-size:24px;font-weight:700;letter-spacing:.5px}
.brand p{color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font-family:inherit;font-size:13px;cursor:pointer;border:none;border-radius:12px;padding:9px 14px;transition:.18s}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(47,111,143,.28)}
.btn-primary:hover{background:#275e7a}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--text);backdrop-filter:blur(10px)}
.btn-ghost:hover{background:rgba(255,255,255,.9)}
.btn-danger-ghost{background:transparent;border:1px solid rgba(239,100,97,.35);color:var(--r3)}

/* ===== 统计看板 ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:18px;backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.stat .num{font-size:28px;font-weight:700}
.stat .label{color:var(--muted);font-size:12.5px;margin-top:2px}
.stat .num.accent{color:var(--accent)} .stat .num.teal{color:var(--teal)}

/* ===== 标签页 ===== */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{background:transparent;color:var(--muted);padding:8px 16px;border-radius:12px}
.tab.active{background:var(--card);color:var(--text);border:1px solid var(--card-border);backdrop-filter:blur(10px);font-weight:500}

/* ===== 卡片列表 ===== */
.list{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:18px;backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.card-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.subject{background:rgba(20,184,166,.12);color:var(--teal)}
.tag.reason-概念不清{background:rgba(99,102,241,.13);color:var(--r1)}
.tag.reason-计算失误{background:rgba(245,158,11,.14);color:var(--r2)}
.tag.reason-审题失误{background:rgba(239,100,97,.13);color:var(--r3)}
.tag.reason-方法不会{background:rgba(20,184,166,.13);color:var(--r4)}
.card-problem{font-size:15px;margin-bottom:12px}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:16px;color:var(--muted);font-size:12.5px}
.mastery{display:flex;align-items:center;gap:8px}
.ring{width:34px;height:34px}
.card-ops{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.op{padding:7px 12px;border-radius:10px;font-size:12.5px}
.op.weak{background:rgba(239,100,97,.12);color:var(--r3)}
.op.good{background:rgba(20,184,166,.13);color:var(--teal)}
.op.plain{background:var(--accent-soft);color:var(--accent)}

/* ===== 空态 ===== */
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:48px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);font-size:16px;margin-bottom:6px}
.empty p{font-size:13px}

/* ===== 抽屉表单 ===== */
.mask{position:fixed;inset:0;background:rgba(31,41,55,.28);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,92vw);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);box-shadow:-12px 0 40px rgba(31,41,55,.15);transform:translateX(100%);transition:.25s;z-index:21;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-head h2{font-size:17px}
.drawer-body{padding:22px;display:grid;gap:16px;overflow-y:auto}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.7);color:var(--text)}
.field textarea{resize:vertical;min-height:78px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.drawer-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* ===== 响应式 ===== */
@media (max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .card-ops{margin-left:0;width:100%}
}
@media (max-width:640px){
  input,select,textarea{font-size:16px}
  button{min-height:44px}
}
@media (max-width:480px){
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .wrap{padding:20px 14px 60px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>错题复习调度工具</h1>
      <p>录入错题，按掌握度自动安排复习时间</p>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="btn-sample">载入示例</button>
      <button class="btn-ghost" id="btn-export">导出 CSV</button>
      <button class="btn-danger-ghost" id="btn-clear">清空数据</button>
      <button class="btn-primary" id="btn-add">录入错题</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <nav class="tabs">
    <button class="tab active" data-tab="today">今日待复习</button>
    <button class="tab" data-tab="all">全部错题</button>
  </nav>

  <section class="list" id="list"></section>
</div>

<!-- 录入抽屉 -->
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawer-title">录入错题</h2>
    <button class="btn-ghost" id="btn-close">关闭</button>
  </div>
  <div class="drawer-body">
    <div class="field-row">
      <div class="field">
        <label>科目</label>
        <input list="subject-list" id="f-subject" placeholder="如 数学">
        <datalist id="subject-list">
          <option value="数学"></option><option value="物理"></option><option value="化学"></option>
          <option value="英语"></option><option value="语文"></option>
        </datalist>
      </div>
      <div class="field">
        <label>知识点</label>
        <input id="f-topic" placeholder="如 单调性">
      </div>
    </div>
    <div class="field">
      <label>错因类型</label>
      <select id="f-reason">
        <option value="概念不清">概念不清</option>
        <option value="计算失误">计算失误</option>
        <option value="审题失误">审题失误</option>
        <option value="方法不会">方法不会</option>
      </select>
    </div>
    <div class="field">
      <label>题目简述</label>
      <textarea id="f-problem" placeholder="写下题干要点或错处，便于复习时回忆"></textarea>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn-ghost" id="btn-cancel">取消</button>
    <button class="btn-primary" id="btn-save">保存错题</button>
  </div>
</aside>

<script>
/* ================= 数据与规则 ================= */
const STORE = 'mistake-review-v1';
// 掌握度 0~5 对应的复习间隔（天）：未掌握当天，逐级拉长到 30 天
const INTERVALS = [0, 1, 3, 7, 15, 30];
const MASTERY_LABEL = ['未掌握', '初学', '略懂', '熟悉', '较稳', '已掌握'];
const REASONS = ['概念不清', '计算失误', '审题失误', '方法不会'];

let state = load();
let tab = 'today';
let editingId = null;

function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || []; }
  catch (e) { return []; }
}
function save() { localStorage.setItem(STORE, JSON.stringify(state)); }
function todayStr() { const d = new Date(); return toStr(d); }
function toStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addDays(str, n) { const d = new Date(str + 'T00:00:00'); d.setDate(d.getDate() + n); return toStr(d); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ================= 统计 ================= */
function stats() {
  const t = todayStr();
  const due = state.filter(x => x.nextReview <= t);
  const mastered = state.filter(x => x.mastery === 5);
  const weekAgo = addDays(t, -7);
  const reviewed = state.filter(x => x.lastReviewed && x.lastReviewed >= weekAgo);
  return { total: state.length, due: due.length, mastered: mastered.length, reviewed: reviewed.length };
}

/* ================= 渲染 ================= */
function ring(m) {
  const C = 2 * Math.PI * 15;
  const off = C * (1 - m / 5);
  return `<svg class="ring" viewBox="0 0 34 34" aria-label="掌握度 ${m}/5">
    <circle cx="17" cy="17" r="15" fill="none" stroke="rgba(47,111,143,.15)" stroke-width="3"/>
    <circle cx="17" cy="17" r="15" fill="none" stroke="#2f6f8f" stroke-width="3"
      stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 17 17)"/>
    <text x="17" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">${m}</text>
  </svg>`;
}

function card(item) {
  const due = item.nextReview <= todayStr();
  const ops = `
    <div class="card-ops">
      <button class="op weak" data-act="weak" data-id="${item.id}">仍薄弱</button>
      <button class="op good" data-act="good" data-id="${item.id}">已掌握</button>
      <button class="op plain" data-act="del" data-id="${item.id}">删除</button>
    </div>`;
  return `<article class="card">
    <div class="card-top">
      <span class="tag subject">${esc(item.subject)}</span>
      <span class="tag">${esc(item.topic)}</span>
      <span class="tag reason-${esc(item.reason)}">${esc(item.reason)}</span>
    </div>
    <div class="card-problem">${esc(item.problem)}</div>
    <div class="card-meta">
      <span class="mastery">${ring(item.mastery)} ${MASTERY_LABEL[item.mastery]}</span>
      <span>录入 ${esc(item.created)}</span>
      <span>下次复习 ${esc(item.nextReview)}${due ? '（到期）' : ''}</span>
      <span>已复习 ${item.reviewCount || 0} 次</span>
      ${ops}
    </div>
  </article>`;
}

function render() {
  const s = stats();
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num accent">${s.due}</div><div class="label">今日待复习</div></div>
    <div class="stat"><div class="num">${s.total}</div><div class="label">累计错题</div></div>
    <div class="stat"><div class="num teal">${s.mastered}</div><div class="label">已掌握</div></div>
    <div class="stat"><div class="num">${s.reviewed}</div><div class="label">近 7 天复习</div></div>`;

  let list = state.slice();
  if (tab === 'today') {
    list = list.filter(x => x.nextReview <= todayStr());
    list.sort((a, b) => a.mastery - b.mastery || a.nextReview.localeCompare(b.nextReview));
  } else {
    list.sort((a, b) => a.nextReview.localeCompare(b.nextReview));
  }
  const box = document.getElementById('list');
  if (!list.length) {
    box.innerHTML = `<div class="empty"><h3>${tab === 'today' ? '今天没有待复习的错题' : '还没有录入错题'}</h3>
      <p>${tab === 'today' ? '到了复习日期的错题会自动出现在这里' : '点击右上角「录入错题」添加第一道错题'}</p></div>`;
  } else {
    box.innerHTML = list.map(card).join('');
  }
}

/* ================= 复习调度规则 ================= */
function review(id, passed) {
  const it = state.find(x => x.id === id);
  if (!it) return;
  it.lastReviewed = todayStr();
  it.reviewCount = (it.reviewCount || 0) + 1;
  it.mastery = passed ? Math.min(5, it.mastery + 1) : Math.max(0, it.mastery - 1);
  it.nextReview = addDays(todayStr(), INTERVALS[it.mastery]);
  save(); render();
}

/* ================= 表单抽屉 ================= */
const drawer = document.getElementById('drawer');
const mask = document.getElementById('mask');
function openDrawer() { drawer.classList.add('show'); mask.classList.add('show'); }
function closeDrawer() { drawer.classList.remove('show'); mask.classList.remove('show'); editingId = null; }

document.getElementById('btn-add').onclick = () => {
  editingId = null;
  document.getElementById('drawer-title').textContent = '录入错题';
  document.getElementById('f-subject').value = '';
  document.getElementById('f-topic').value = '';
  document.getElementById('f-reason').value = REASONS[0];
  document.getElementById('f-problem').value = '';
  openDrawer();
};
document.getElementById('btn-close').onclick = closeDrawer;
document.getElementById('btn-cancel').onclick = closeDrawer;
mask.onclick = closeDrawer;

document.getElementById('btn-save').onclick = () => {
  const subject = document.getElementById('f-subject').value.trim();
  const topic = document.getElementById('f-topic').value.trim();
  const reason = document.getElementById('f-reason').value;
  const problem = document.getElementById('f-problem').value.trim();
  if (!subject || !topic || !problem) { alert('请填写科目、知识点和题目简述'); return; }
  if (editingId) {
    const it = state.find(x => x.id === editingId);
    Object.assign(it, { subject, topic, reason, problem });
  } else {
    state.push({
      id: uid(), subject, topic, reason, problem,
      created: todayStr(), lastReviewed: null, mastery: 0, reviewCount: 0,
      nextReview: todayStr(),
    });
  }
  save(); closeDrawer(); render();
};

/* ================= 列表操作 ================= */
document.getElementById('list').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const { act, id } = btn.dataset;
  if (act === 'good') review(id, true);
  else if (act === 'weak') review(id, false);
  else if (act === 'del') {
    if (confirm('确定删除这道错题吗？')) { state = state.filter(x => x.id !== id); save(); render(); }
  }
});

/* ================= 标签页 ================= */
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    tab = t.dataset.tab; render();
  };
});

/* ================= 导出 CSV ================= */
document.getElementById('btn-export').onclick = () => {
  if (!state.length) { alert('暂无数据可导出'); return; }
  const head = ['科目', '知识点', '错因类型', '题目简述', '录入日期', '上次复习', '掌握度', '复习次数', '下次复习日期'];
  const rows = state.map(x => [x.subject, x.topic, x.reason, x.problem, x.created, x.lastReviewed || '', MASTERY_LABEL[x.mastery], x.reviewCount || 0, x.nextReview]);
  const csv = [head, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '错题记录_' + todayStr() + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

/* ================= 示例与清空 ================= */
document.getElementById('btn-sample').onclick = () => {
  const t = todayStr();
  const sample = [
    { subject: '数学', topic: '函数单调性', reason: '概念不清', problem: '分不清单调区间与定义域的关系，证明时漏写取值范围。', mastery: 2, reviewCount: 2 },
    { subject: '数学', topic: '集合运算', reason: '审题失误', problem: '交集并集符号看反，漏看补集条件。', mastery: 1, reviewCount: 1 },
    { subject: '英语', topic: '时态辨析', reason: '方法不会', problem: '现在完成时与一般过去时选用判断不清。', mastery: 0, reviewCount: 0 },
    { subject: '化学', topic: '氧化还原', reason: '计算失误', problem: '配平电子转移数时系数算错。', mastery: 3, reviewCount: 3 },
    { subject: '物理', topic: '受力分析', reason: '方法不会', problem: '整体法与隔离法选用时机判断错误。', mastery: 1, reviewCount: 1 },
  ].map((x, i) => ({
    id: uid() + i, subject: x.subject, topic: x.topic, reason: x.reason, problem: x.problem,
    created: addDays(t, -(x.reviewCount * 2 + 1)), lastReviewed: x.reviewCount ? addDays(t, -1) : null,
    mastery: x.mastery, reviewCount: x.reviewCount, nextReview: addDays(t, INTERVALS[x.mastery]),
  }));
  state = state.concat(sample);
  save(); render();
};

document.getElementById('btn-clear').onclick = () => {
  if (!state.length) { alert('当前没有数据'); return; }
  if (confirm('确定清空全部错题记录吗？此操作不可恢复。')) { state = []; save(); render(); }
};

render();
</script>
</body>
</html>
